<!DOCTYPE html>
<html>
<head>
    <title>Test Metro Status</title>
</head>
<body>

<h2>Update Metro Status</h2>

<select id="line">
    <option>Blue Line</option>
    <option>Green Line</option>
    <option>Red Line</option>
</select>

<select id="status">
    <option>normal</option>
    <option>busy</option>
    <option>maintenance</option>
</select>

<button onclick="updateStatus()">Update</button>

<p id="result"></p>

<script>
function updateStatus() {

    const formData = new FormData();

    formData.append("line_name", document.getElementById("line").value);
    formData.append("status", document.getElementById("status").value);

    fetch("api/update_metroStatus.php", {
        method: "POST",
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("result").innerHTML = data.message;
    });

}
</script>

</body>
</html>
